name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (real Postgres + Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tender
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tender -d tender"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env.local
        run: |
          cat > .env.local <<'ENV'
          DATABASE_URL=postgres://tender:ci-only-password@localhost:5433/tender
          BETTER_AUTH_SECRET=ci-only-secret-that-is-at-least-32-characters
          BETTER_AUTH_URL=http://localhost:3100
          GOOGLE_CLIENT_ID=ci-only-client-id
          GOOGLE_CLIENT_SECRET=ci-only-client-secret
          NEXT_PUBLIC_FILE_STORE=local
          ENV
      - run: google-chrome --version
      - run: pnpm test:integration
